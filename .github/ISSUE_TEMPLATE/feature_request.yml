name: Feature request
description: An idea that would make Syncstone better.
title: "[Idea] "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Keep in mind that Syncstone encrypts your notes on your device, so features that need the server to read your content are not possible.

        Many features need changes in the Syncstone service as well as in this plugin. The service is not open source, so we decide those ourselves, but we read every idea.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem, not the solution. What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      options:
        - Sync
        - Live collaboration
        - Sharing and published notes
        - Version history and trash
        - Sign in and settings
        - Mobile
        - Something else
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and did not find this idea.
          required: true
